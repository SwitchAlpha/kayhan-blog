# Local development: only Postgres, published on localhost.
# usage: docker compose -f compose.dev.yml up -d
name: blog-dev
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-blog}
      POSTGRES_USER: kb
      POSTGRES_PASSWORD: kb
      POSTGRES_INITDB_ARGS: "--locale=C.UTF-8 --encoding=UTF8"
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kb -d ${POSTGRES_DB:-blog}"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  pgdata_dev: {}
